<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050108"/>
      <stop offset="50%" stop-color="#0e0312"/>
      <stop offset="100%" stop-color="#040106"/>
    </linearGradient>

    <!-- Neon Crimson Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e42"/>
      <stop offset="50%" stop-color="#cc102f"/>
      <stop offset="100%" stop-color="#8a001a"/>
    </linearGradient>

    <!-- Metallic Silver Gradient for Text -->
    <linearGradient id="silverText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>

    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ff1e42" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#gridPattern)"/>
  <rect width="1280" height="640" fill="url(#dotPattern)"/>

  <!-- Tactical Vignette & Glow Spheres -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#ff1e42" stop-opacity="0.12"/>
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
  </radialGradient>
  <rect width="1280" height="640" fill="url(#vignette)"/>

  <!-- High-Tech Corner Brackets -->
  <g stroke="#ff1e42" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 40 70 L 40 40 L 70 40"/>
    <path d="M 1240 70 L 1240 40 L 1210 40"/>
    <path d="M 40 570 L 40 600 L 70 600"/>
    <path d="M 1240 570 L 1240 600 L 1210 600"/>
  </g>

  <!-- Cyberpunk Top Tactical Status Bar -->
  <g opacity="0.75">
    <text x="60" y="55" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" letter-spacing="3">SYS_ID: JARVIS_CORE_v2.0 // TACTICAL HUD ONLINE</text>
    <text x="1080" y="55" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f2fe" letter-spacing="2">PORT: 8000 [SECURE]</text>
    <circle cx="1065" cy="51" r="4" fill="#00f2fe" filter="url(#cyanGlow)"/>
    <line x1="60" y1="68" x2="1220" y2="68" stroke="#ff1e42" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- Central Arc Reactor / HUD Reticle Graphics -->
  <g transform="translate(640, 270)">
    <!-- Outer Arc Rings -->
    <circle r="180" fill="none" stroke="#ff1e42" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="10 8"/>
    <circle r="150" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="80 30 20 30"/>
    <circle r="130" fill="none" stroke="#ff1e42" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="4 6"/>
    
    <!-- Radar Sweep Rays -->
    <line x1="-210" y1="0" x2="210" y2="0" stroke="#ff1e42" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 4"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#ff1e42" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 4"/>

    <!-- Central Gotham Bat Crest Silhouette (Subtle Backlight) -->
    <path d="M 0 -35 C -12 -50 -30 -55 -45 -45 C -55 -40 -62 -25 -65 -15 C -75 -25 -90 -25 -105 -15 C -115 -10 -125 10 -125 20 C -125 35 -110 50 -85 45 C -65 40 -50 25 -40 20 C -30 30 -15 50 0 65 C 15 50 30 30 40 20 C 50 25 65 40 85 45 C 110 50 125 35 125 20 C 125 10 115 -10 105 -15 C 90 -25 75 -25 65 -15 C 62 -25 55 -40 45 -45 C 30 -55 12 -50 0 -35 Z" 
          fill="#ff1e42" fill-opacity="0.08" stroke="#ff1e42" stroke-width="1.5" stroke-opacity="0.3" filter="url(#crimsonGlow)"/>
  </g>

  <!-- Dynamic Equalizer / Audio Spectrum Bars in Center Background -->
  <g transform="translate(640, 290)" opacity="0.45">
    <rect x="-140" y="-8" width="6" height="16" fill="#ff1e42" rx="3"/>
    <rect x="-120" y="-18" width="6" height="36" fill="#ff1e42" rx="3"/>
    <rect x="-100" y="-32" width="6" height="64" fill="#ff1e42" rx="3"/>
    <rect x="-80" y="-45" width="6" height="90" fill="#00f2fe" rx="3"/>
    <rect x="-60" y="-25" width="6" height="50" fill="#ff1e42" rx="3"/>
    <rect x="-40" y="-12" width="6" height="24" fill="#ff1e42" rx="3"/>
    <rect x="-20" y="-38" width="6" height="76" fill="#ff1e42" rx="3"/>
    <rect x="0" y="-55" width="6" height="110" fill="#00f2fe" rx="3"/>
    <rect x="20" y="-38" width="6" height="76" fill="#ff1e42" rx="3"/>
    <rect x="40" y="-12" width="6" height="24" fill="#ff1e42" rx="3"/>
    <rect x="60" y="-25" width="6" height="50" fill="#ff1e42" rx="3"/>
    <rect x="80" y="-45" width="6" height="90" fill="#00f2fe" rx="3"/>
    <rect x="100" y="-32" width="6" height="64" fill="#ff1e42" rx="3"/>
    <rect x="120" y="-18" width="6" height="36" fill="#ff1e42" rx="3"/>
    <rect x="140" y="-8" width="6" height="16" fill="#ff1e42" rx="3"/>
  </g>

  <!-- Main Hero Titles -->
  <g text-anchor="middle">
    <!-- Main Title Glow Underlay -->
    <text x="640" y="260" font-family="'Orbitron', 'Barlow Condensed', 'Arial Black', sans-serif" font-size="110" font-weight="900" fill="#ff1e42" letter-spacing="18" opacity="0.35" filter="url(#crimsonGlow)">J.A.R.V.I.S.</text>
    
    <!-- Main Title -->
    <text x="640" y="260" font-family="'Orbitron', 'Barlow Condensed', 'Arial Black', sans-serif" font-size="110" font-weight="900" fill="url(#silverText)" letter-spacing="18">J.A.R.V.I.S.</text>

    <!-- Subtitle Bar -->
    <text x="640" y="325" font-family="'Rajdhani', 'JetBrains Mono', sans-serif" font-size="24" font-weight="700" fill="#ff1e42" letter-spacing="10">AUTONOMOUS MULTI-MODAL AI SYSTEM</text>
    <text x="640" y="365" font-family="'JetBrains Mono', monospace" font-size="15" fill="#94a3b8" letter-spacing="4">VOICE STREAMING • QUAD-TIER MEMORY • VISION HUD • CPT FINE-TUNING</text>
  </g>

  <!-- Horizontal Glow Divider -->
  <g transform="translate(640, 400)">
    <line x1="-380" y1="0" x2="380" y2="0" stroke="url(#crimsonGrad)" stroke-width="2" filter="url(#crimsonGlow)"/>
    <circle cx="0" cy="0" r="5" fill="#00f2fe" filter="url(#cyanGlow)"/>
    <polygon points="-12,-6 -6,0 -12,6" fill="#ff1e42"/>
    <polygon points="12,-6 6,0 12,6" fill="#ff1e42"/>
  </g>

  <!-- Feature Badge Cards (Bottom Tier) -->
  <g transform="translate(640, 480)">
    <!-- Badge 1: Tri-Persona -->
    <g transform="translate(-450, 0)">
      <rect x="-115" y="-30" width="230" height="60" rx="8" fill="#120417" stroke="#ff1e42" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="0" y="-8" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">🎭 TRI-PERSONA</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ff6b81" text-anchor="middle">Prime • Grok • Alfred</text>
    </g>

    <!-- Badge 2: Quad-Tier Memory -->
    <g transform="translate(-150, 0)">
      <rect x="-115" y="-30" width="230" height="60" rx="8" fill="#120417" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="0" y="-8" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">🧠 QUAD MEMORY</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38ef7d" text-anchor="middle">SQLite + ChromaDB RAG</text>
    </g>

    <!-- Badge 3: Multimodal Vision -->
    <g transform="translate(150, 0)">
      <rect x="-115" y="-30" width="230" height="60" rx="8" fill="#120417" stroke="#ff1e42" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="0" y="-8" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">👁️ VISION ENGINE</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f6d365" text-anchor="middle">Live Screen + Webcam</text>
    </g>

    <!-- Badge 4: Ponytail-Sec -->
    <g transform="translate(450, 0)">
      <rect x="-115" y="-30" width="230" height="60" rx="8" fill="#120417" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="0" y="-8" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">🛡️ PONYTAIL-SEC</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00f2fe" text-anchor="middle">Hardened &amp; Verified</text>
    </g>
  </g>

  <!-- Bottom Metadata Footer -->
  <g opacity="0.6" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">
    <text x="60" y="605">DEVELOPED BY NITIN EKKA (Nitinekka504)</text>
    <text x="1220" y="605" text-anchor="end">AUTONOMOUS AGENTIC INTELLIGENCE // MIT LICENSED</text>
  </g>
</svg>
