<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Acquired Knowledge & Research Reports</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        .reports-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .reports-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .reports-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--primary-neon);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .reports-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn-action {
            background: rgba(0, 242, 254, 0.15);
            border: 1px solid var(--primary-neon);
            color: var(--primary-neon);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: var(--primary-neon);
            color: #0b1329;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-neon);
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
        }

        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .report-card {
            background: rgba(11, 19, 41, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            transition: all 0.25 ease;
            backdrop-filter: blur(8px);
        }

        .report-card:hover {
            border-color: var(--primary-neon);
            box-shadow: 0 5px 20px rgba(0, 242, 254, 0.15);
            transform: translateY(-2px);
        }

        .report-card .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-neon);
            line-height: 1.4;
        }

        .report-card .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }

        .report-card .card-content {
            font-size: 0.9rem;
            color: var(--text-color);
            line-height: 1.5;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .report-card .card-footer {
            margin-top: auto;
            padding-top: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-source {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            color: var(--secondary-neon);
        }
    </style>
</head>
<body>
    <div class="reports-container">
        <header class="reports-header">
            <h1>📄 KNOWLEDGE VAULT & RESEARCH REPORTS</h1>
            <div class="reports-controls">
                <button class="btn-action" id="btn-export-md">📥 Export Markdown</button>
                <a href="/" class="btn-action">🖥️ Back to HUD</a>
            </div>
        </header>

        <div class="filter-bar">
            <div class="search-box">
                <input type="text" id="report-search" placeholder="Search research topics, topics learned, or keywords...">
            </div>
            <span class="badge green" id="report-count-badge">0 REPORTS FOUND</span>
        </div>

        <main class="reports-grid" id="reports-grid">
            <div class="empty-state" style="grid-column: 1/-1; text-align: center; padding: 3rem;">
                Loading acquired knowledge records...
            </div>
        </main>
    </div>

    <script>
        let allReports = [];

        async function fetchReports() {
            try {
                const res = await fetch('/api/reports');
                const data = await res.json();
                allReports = data.reports || [];
                renderReports(allReports);
            } catch (e) {
                console.error("Failed to fetch reports:", e);
            }
        }

        function renderReports(reports) {
            const grid = document.getElementById('reports-grid');
            const badge = document.getElementById('report-count-badge');

            badge.textContent = `${reports.length} REPORTS FOUND`;

            if (!reports || reports.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1; text-align: center; padding: 3rem;">No research reports found matching search criteria.</div>';
                return;
            }

            let html = '';
            reports.forEach(r => {
                const dateStr = new Date(r.timestamp * 1000).toLocaleString();
                html += `
                    <div class="report-card">
                        <div class="card-title">${escapeHtml(r.topic || 'Web Research')}</div>
                        <div class="card-meta">
                            <span>Source: ${escapeHtml(r.source || 'DuckDuckGo')}</span>
                            <span>${dateStr}</span>
                        </div>
                        <div class="card-content">${escapeHtml(r.content || '')}</div>
                        <div class="card-footer">
                            <span class="badge-source">${escapeHtml(r.category || 'Research Report')}</span>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        document.getElementById('report-search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                renderReports(allReports);
                return;
            }
            const filtered = allReports.filter(r => 
                (r.topic && r.topic.toLowerCase().includes(query)) ||
                (r.content && r.content.toLowerCase().includes(query)) ||
                (r.source && r.source.toLowerCase().includes(query))
            );
            renderReports(filtered);
        });

        document.getElementById('btn-export-md').addEventListener('click', () => {
            if (!allReports || allReports.length === 0) {
                alert("No reports available to export.");
                return;
            }
            let md = "# JARVIS Acquired Knowledge & Research Report Export\n\n";
            md += `Generated: ${new Date().toLocaleString()}\n\n---\n\n`;

            allReports.forEach((r, idx) => {
                md += `## ${idx + 1}. ${r.topic || 'Research Topic'}\n`;
                md += `- **Date:** ${new Date(r.timestamp * 1000).toLocaleString()}\n`;
                md += `- **Source:** ${r.source || 'DuckDuckGo'}\n\n`;
                md += `### Acquired Insights:\n${r.content}\n\n---\n\n`;
            });

            const blob = new Blob([md], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `JARVIS_Research_Report_${Date.now()}.md`;
            a.click();
            URL.revokeObjectURL(url);
        });

        function escapeHtml(text) {
            return (text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        fetchReports();
    </script>
</body>
</html>
